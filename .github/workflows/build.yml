name: Windows backend package
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist
        env:
          PETRA_LICENSE_SECRET: ${{ secrets.PETRA_LICENSE_SECRET }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: PetraDMS-Windows
          path: dist/*.exe
          if-no-files-found: error
