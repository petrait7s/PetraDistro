name: Linux AppImage
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist:linux
        env:
          PETRA_LICENSE_SECRET: ${{ secrets.PETRA_LICENSE_SECRET }}
          PETRA_LICENSE_CODE: ${{ secrets.PETRA_LICENSE_CODE }}
      - uses: actions/upload-artifact@v4
        with:
          name: PetraDMS-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
